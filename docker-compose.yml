services:
  app:
    build: ./backend
    image: shvedov-devops2:1.0
    ports: ["127.0.0.1:8083:8080"]
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:?Create .env first}
      DB_NAME: ${DB_NAME:-appdb}
    volumes: ["./frontend:/app/static:ro"]
    depends_on:
      db:
        condition: service_healthy
    networks: [app_net]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env first}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [app_net]
volumes:
  db_data:
networks:
  app_net:
