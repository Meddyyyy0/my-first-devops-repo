name: Practice 3 deployment checks
on:
  push:
    branches: [practice-3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-and-test:
    runs-on: [self-hosted, devops-lab-shvedov]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: shvedov-practice3
      DB_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Create environment file
        shell: bash
        run: |
          umask 077
          printf 'DB_USER=app\nDB_NAME=appdb\nDB_PASSWORD=%s\n' "$DB_PASSWORD" > .env
          mkdir -p verification
          sed 's/=.*/=***/' .env > verification/.env
      - name: Start application
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test application and database
        run: |
          python3 scripts/check.py
          node scripts/check-frontend.js
      - name: Save container logs
        if: always()
        run: |
          mkdir -p verification
          docker compose ps > verification/containers.txt
          docker compose logs --no-color > verification/docker.log
          docker images > verification/images.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice3-checks
          path: verification/
          include-hidden-files: true
