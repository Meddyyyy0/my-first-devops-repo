services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.1
    platform: linux/amd64
    ports: ["127.0.0.1:8065:8065"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${DB_POSTGRES_PASSWORD:?required}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    volumes:
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
    networks: [mm_net]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: mattermost
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [mm_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      retries: 40
volumes:
  mm_data:
    name: shvedov_mm_data
  mm_logs:
    name: shvedov_mm_logs
  postgres_data:
    name: shvedov_mm_postgres
networks:
  mm_net:
    name: shvedov_mm_net
